aid: 3protv
name: 3ProTV
description: >-
  3ProTV (삼프로TV), operated by E-Broadcasting Co. of Seoul, South Korea, is the country's
  largest economic and financial media platform — a YouTube-native economics broadcaster
  founded in 2018 that has grown into a subscription content business spanning live market
  programming, original news and research (PDS) archives, premium lectures and seminars,
  paid membership clubs, and a publishing arm. Its content is distributed through the 3ProTV
  web application at apps.3protv.com and native iOS and Android apps backed by a private
  application API at api.3protv.com. 3ProTV is an end-user media and education product: as of
  this profile it publishes no public developer program, API reference, machine-readable
  contract, SDK or webhook surface.
